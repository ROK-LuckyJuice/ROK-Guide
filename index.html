/* 공략 목록 카드 개선: 기존 데이터 및 편집기 유지 */
.cards{align-items:stretch}
.card.guide-card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;cursor:pointer}
.card.guide-card:hover{transform:translateY(-3px);border-color:#b99554;box-shadow:0 12px 26px #0004}
.card.guide-card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.guide-cover{aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,#34465c,#172335);display:flex;align-items:center;justify-content:center;position:relative}
.guide-cover img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
.guide-card:hover .guide-cover img{transform:scale(1.035)}
.guide-cover-placeholder{font-size:52px;line-height:1;text-shadow:0 4px 12px #0007}
.guide-card-body{padding:18px 19px 20px;display:flex;flex-direction:column;flex:1;gap:9px}
.guide-card .tag{font-weight:700;letter-spacing:.02em}
.guide-card h3{margin:0;font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.guide-card p{margin:0;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:3.2em;overflow-wrap:anywhere}
.guide-card .guide-open{margin-top:auto;align-self:flex-start;color:var(--gold);font-size:13px;font-weight:800;padding-top:7px}

/* 대표 이미지 관리 */
.cover-manager{display:grid;gap:10px;padding:12px;border:1px solid var(--edge);border-radius:12px;background:#111d2c}
.cover-preview{width:100%;max-height:230px;aspect-ratio:16/9;object-fit:contain;background:#0b1420;border-radius:9px}
.cover-empty{padding:25px 12px;text-align:center;color:var(--muted);border:1px dashed var(--edge);border-radius:9px}
.cover-hint{font-size:12px;color:var(--muted);line-height:1.6}

/* 공략 임시저장 및 복구 */

.draft-manager .actions{align-items:center}
.draft-status{font-size:12px;color:var(--muted);line-height:1.5}
.draft-manager .ghost{padding:8px 11px}

.admin-guide-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px);gap:8px;margin:14px 0}
.admin-guide-controls input,.admin-guide-controls select{width:100%;min-width:0}
.admin-guide-list{display:grid;gap:9px;max-height:48vh;overflow:auto}
.admin-guide-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#101b2b;border:1px solid var(--edge);border-radius:11px;padding:12px}
.admin-guide-info{min-width:0;flex:1}.admin-guide-info strong{display:block;overflow-wrap:anywhere;margin:4px 0}.admin-guide-info .small{font-size:12px}

/* 공략 자동 목차: 저장된 본문은 수정하지 않고 표시 시에만 생성 */
.guide-toc{background:#102538;border:1px solid #536078;border-radius:12px;padding:15px 17px;margin:15px 0 22px}
.guide-toc-title{font-weight:800;color:var(--gold);margin-bottom:9px}
.guide-toc-list{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.guide-toc-item button{display:block;width:100%;text-align:left;border:0;border-radius:7px;background:transparent;color:#dce8f5;padding:7px 9px;line-height:1.5;overflow-wrap:anywhere}
.guide-toc-item button:hover,.guide-toc-item button:focus-visible{background:#29415b;outline:2px solid #e7c27855}
.guide-toc-item.level-3{padding-left:17px;font-size:14px}
.guide-toc-target{scroll-margin-top:18px}
.guide-toc-back{display:block;margin:10px 0 17px;color:var(--gold);background:transparent;border:0;padding:5px 0;font-size:13px}

/* Real three-column open-book layout, preserving all existing application IDs. */
body{background:radial-gradient(ellipse at top,#493022 0%,#1a100d 62%,#100b09 100%)}
.wrap{max-width:1480px;padding:18px 22px 55px}
.top{background:linear-gradient(#39251b,#1b120e);border:2px ridge #9d7037;padding:14px 24px;border-radius:7px}
.hero{min-height:185px;margin:10px 0 0;background:radial-gradient(ellipse at 70% 20%,#8e674b66,transparent 60%),linear-gradient(115deg,#23150f,#4e3020,#211510);border:2px solid #a8793b;border-radius:8px 8px 0 0;padding:30px 16px}
.hero h1{font-family:Georgia,'Malgun Gothic',serif;color:#f9d78f}
.hero .search{display:none}
.book-layout{display:grid;grid-template-columns:minmax(195px,23%) minmax(0,1fr) minmax(210px,24%);gap:0;align-items:stretch;min-height:660px;background:#cfab71;border:11px solid #3b2316;border-radius:22px 22px 34px 34px;box-shadow:0 0 0 3px #b58a47,0 22px 42px #000b;overflow:hidden}
.book-left,.book-center,.book-right{min-width:0;padding:28px 20px 36px;color:#43291a;background-color:#e6c997;background-image:radial-gradient(ellipse at 14% 20%,#fff8d29c,transparent 53%),radial-gradient(ellipse at 90% 88%,#99653642,transparent 55%),repeating-linear-gradient(25deg,#6e421008 0 1px,transparent 1px 7px),linear-gradient(100deg,#d3ab6f,#f0d6a6 18%,#ecd1a0 84%,#c49a60)}
.book-left{border-right:4px solid #b78b55;box-shadow:inset -12px 0 18px #5d37172e}
.book-center{border-right:4px solid #b78b55;box-shadow:inset 12px 0 16px #8a55282e,inset -10px 0 16px #8a55282e}
.book-right{box-shadow:inset 10px 0 17px #5d37172e}
.book-label,.side-paper h2{font-size:19px;color:#4b2718;font-family:Georgia,'Malgun Gothic',serif;text-align:center;margin:0 0 20px;border-bottom:2px double #9b693b;padding-bottom:14px}
.book-layout .cats{display:flex;flex-direction:column;gap:10px;margin:0}
.book-layout .cat{min-height:0!important;padding:13px 12px!important;display:flex;align-items:center;gap:10px;border-radius:5px!important;text-align:left;font-size:15px!important;color:#452918!important;background:linear-gradient(160deg,#f7e5bc,#d3ad70)!important;border:2px solid #9b713c!important;box-shadow:inset 0 0 0 2px #f9e4b7,0 3px 4px #59381855!important}
.book-layout .cat span{display:inline-flex!important;min-height:0!important;margin:0!important;font-size:22px!important;flex:0 0 34px}
.book-layout .cat.active{background:linear-gradient(150deg,#71301e,#3b1915)!important;color:#ffe8b2!important;border-color:#d3a554!important}
.book-center .section{margin:0 0 22px;padding:8px 0 15px;border-bottom:2px solid #ac814f}
.book-center .section h2{font-size:30px;color:#502819!important;font-family:Georgia,'Malgun Gothic',serif}
.book-center .small{color:#775536}
.book-center .cards{display:grid!important;grid-template-columns:1fr!important;gap:15px!important}
.book-center .guide-card{display:grid!important;grid-template-columns:minmax(115px,30%) minmax(0,1fr);align-items:stretch;background:linear-gradient(120deg,#f6e2b5,#dfbb83)!important;border:2px solid #aa7c46!important;border-radius:5px!important;overflow:hidden;box-shadow:0 5px 8px #65401b50!important}
.book-center .guide-card .guide-cover{width:100%!important;height:100%!important;min-height:145px;object-fit:cover}
.book-center .guide-card-body{padding:15px!important;min-height:0!important;border:0!important;background:transparent!important;box-shadow:none!important}
.book-center .guide-card h3{font-size:20px;color:#4d2617!important}
.book-center .guide-card p{color:#62432a!important}
.book-right .side-paper{padding:17px 13px;margin:10px 0 20px;background:linear-gradient(140deg,#f7e3b8,#ddba83);border:2px solid #a57a45;box-shadow:0 5px 10px #6a452b55}
.book-right .side-paper h2{text-align:left;font-size:18px;margin-bottom:13px}
.book-right .search{display:flex;margin:0;gap:6px;flex-wrap:wrap}
.book-right .search input{width:100%;flex-basis:100%;background:#fdf0cf;color:#482b1a;border:1px solid #916537}
.book-right .search button{flex:1}
.recent-guides{display:grid;gap:10px}
.recent-guides button{background:none;border:0;border-bottom:1px solid #ba945e;text-align:left;padding:7px 2px;color:#4b2c1b;font-weight:700;cursor:pointer}
.coupon-side{width:100%;background:linear-gradient(#702c22,#421914);color:#ffdfa0;border:3px ridge #d5a15c;border-radius:5px;padding:19px 12px;font-size:18px;font-weight:800;cursor:pointer}
.coupon-side small{display:block;font-size:12px;margin-top:8px;color:#f7d9a2}
.book-center .calcgrid{grid-template-columns:1fr}
@media(max-width:1000px){.book-layout{grid-template-columns:190px minmax(0,1fr)}.book-right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;border-top:3px solid #aa7c46}.book-right .side-paper{margin:0}.coupon-side{align-self:start}}
@media(max-width:650px){.wrap{padding:8px 8px 35px}.book-layout{grid-template-columns:1fr;border-width:6px}.book-left,.book-center,.book-right{grid-column:1; padding:18px 14px;border-right:0}.book-left{border-bottom:3px solid #b78b55}.book-layout .cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.book-layout .cat{font-size:12px!important;padding:9px 5px!important;gap:3px}.book-layout .cat span{flex-basis:24px;font-size:17px!important}.book-right{display:block}.book-right .side-paper{margin-bottom:12px}.book-center .guide-card{grid-template-columns:32% minmax(0,1fr)}.book-center .guide-card h3{font-size:16px}.book-center .guide-card .guide-cover{min-height:130px}.hero{min-height:140px}}

/* Category icon cleanup: keep the gold owl at the right corner only. */
.book-layout .cat::before,.cat::before{content:none!important;display:none!important;background:none!important;}
.book-layout .cat > span,.cat > span{background-image:none!important;background-color:transparent!important;}
.book-layout .cat::after{z-index:1!important;pointer-events:none!important;}
.book-layout .cat > span{position:relative;z-index:2;}

/* 쿠폰 카드: 밝은 양피지 배경에서 코드/상태/설명이 선명하게 보이도록 조정 */
#couponList .panel{color:#352315!important;}
#couponList .panel strong{color:#4c2910!important;font-size:17px;font-weight:900;text-shadow:none!important;}
#couponList .panel .small,#couponList .panel p{color:#50351e!important;font-weight:700;text-shadow:none!important;}
#couponList .panel .actions button{color:#ffe4a9;}
 .coupon-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 8px}.coupon-tabs button{flex:1;min-width:130px}.coupon-tabs .coupon-tab-active{border-color:#f0c777!important;box-shadow:0 0 0 2px #c49a52,inset 0 1px #fff5!important;background:linear-gradient(160deg,#82502a,#442015)!important;color:#ffe6a8!important;font-weight:900}
.coupon-used-section{margin-top:18px;border-top:1px solid #98754b;padding-top:13px}.coupon-used-toggle{width:100%;text-align:left;font-size:16px;font-weight:800;padding:14px 16px}.coupon-used-section #couponUsedList{padding-top:7px}

/* 모바일 카테고리: 왼쪽 1~4, 오른쪽 5~8 순서로 세로 배치 */
@media(max-width:650px){
  .book-layout .cats{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    grid-template-rows:repeat(4,auto)!important;
    grid-auto-flow:column!important;
  }
}

/* Notice board and compact account indicator */
#accountBtn{white-space:nowrap;min-width:48px}
.notice-board{margin:14px 0 0;border:2px ridge #a67a40;background:linear-gradient(135deg,#e9d5a9,#d6b782);color:#392515;border-radius:9px;padding:12px 16px;box-shadow:0 5px 14px #0007;font-family:Georgia,'Malgun Gothic',serif}
.notice-board summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.notice-board summary::-webkit-details-marker{display:none}
.notice-board summary::after{content:'⌄';font-size:20px}
.notice-board[open] summary::after{content:'⌃'}
.notice-board .notice-list{margin-top:10px;display:grid;gap:9px}
.notice-board .notice-entry{border-top:1px solid #a88454;padding:10px 2px 2px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.notice-board .notice-entry strong{display:block;color:#432713;margin-bottom:4px}
.notice-board .notice-entry time{font-size:12px;color:#6e5131}
.notice-board .notice-empty{color:#60452c;font-size:14px}
.notice-admin-list{display:grid;gap:10px;margin:15px 0}.notice-admin-item{padding:12px;border:1px solid #947247;border-radius:8px;overflow-wrap:anywhere}
.notice-admin-item p{white-space:pre-wrap;line-height:1.6}

/* 방문 시 공지 팝업: 기존 공지사항 및 관리자 기능과 독립 */
.site-notice-overlay{position:fixed;inset:0;z-index:10050;background:#080603b8;display:flex;align-items:center;justify-content:center;padding:18px}
.site-notice-popup{width:min(570px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;background:linear-gradient(145deg,#f5e6c1,#dfc18a);color:#3b2616;border:4px ridge #a47637;border-radius:12px;box-shadow:0 20px 65px #000b;overflow:hidden}
.site-notice-head{padding:16px 20px 12px;border-bottom:2px solid #ac834d;font-size:22px;font-weight:900}
.site-notice-body{overflow:auto;padding:14px 20px;min-height:80px}
.site-notice-item{padding:12px 0;border-bottom:1px solid #b99b70}
.site-notice-item:last-child{border-bottom:0}
.site-notice-item strong{display:block;font-size:17px;overflow-wrap:anywhere}
.site-notice-item time{display:block;color:#735535;font-size:12px;margin:4px 0 8px}
.site-notice-item div{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.site-notice-foot{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px;padding:12px 17px;border-top:2px solid #ac834d}
.site-notice-foot label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.site-notice-foot input{width:18px;height:18px;accent-color:#75461f}
.site-notice-close{padding:9px 17px;background:#522517;color:#fff1cc;border:1px solid #bd8e49;border-radius:5px;font-weight:700}
@media(max-width:480px){.site-notice-head{font-size:19px}.site-notice-foot{justify-content:space-between}.site-notice-body{padding:10px 15px}}

/* 공지 이미지, 건의사항, 닉네임 */
.notice-entry img,.site-notice-item img,.notice-admin-item img{display:block;max-width:100%;max-height:360px;object-fit:contain;margin:10px 0;border:2px solid #b38b55;border-radius:7px}
.notice-nav{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:12px 0}
.notice-nav .notice-board{flex:1;min-width:210px;margin:0}
.suggestion-launch{flex:0 0 auto;background:linear-gradient(135deg,#f1dba9,#d4b47a);color:#382315;border:2px solid #a67a40;border-radius:9px;padding:12px 20px;font-weight:800}
.suggestion-list{display:grid;gap:10px;max-height:54vh;overflow:auto;margin:12px 0}
.suggestion-item{background:#f0dbb2;color:#3c2919;border:1px solid #987344;border-radius:9px;padding:13px;overflow-wrap:anywhere}
.suggestion-item p{white-space:pre-wrap;line-height:1.6}.suggestion-item small{color:#735535}
@media(max-width:480px){.notice-nav{flex-wrap:nowrap;gap:6px}.notice-nav .notice-board{min-width:0;flex:1}.notice-nav .notice-board summary{font-size:13px;padding:12px 8px}.suggestion-launch{flex:0 0 auto;padding:10px 9px;font-size:13px;white-space:nowrap}}

/* 공략 편집기 서식 가독성 개선 */
.rich-editor{color:#ffffff!important;font-style:normal;font-weight:400}
.rich-editor strong,.rich-editor b,.article.rich-content strong,.article.rich-content b{font-weight:900!important;text-shadow:0 0 .7px currentColor;-webkit-text-stroke:.3px currentColor}
.rich-editor em,.rich-editor i,.article.rich-content em,.article.rich-content i{font-style:italic!important;font-synthesis:style;display:inline;transform:skewX(-7deg)}
.rich-editor u,.article.rich-content u{text-decoration:underline!important;text-underline-offset:3px}
.rich-editor [style*="font-weight: bold"],.article.rich-content [style*="font-weight: bold"]{font-weight:900!important}
.rich-toolbar button[data-cmd="bold"]{font-weight:900!important}
.rich-toolbar button[data-cmd="italic"]{font-style:italic!important}
.rich-toolbar button.format-active{background:#715027!important;border-color:#f2cc7b!important;color:#fff!important}

/* 굵게는 브라우저가 생성한 span 스타일에도 동일하게 강하게 표시 */
.rich-editor :is(b,strong,[style*="font-weight: bold"],[style*="font-weight:bold"],[style*="font-weight: 700"],[style*="font-weight:700"],[style*="font-weight: 900"],[style*="font-weight:900"]),
.article.rich-content :is(b,strong,[style*="font-weight: bold"],[style*="font-weight:bold"],[style*="font-weight: 700"],[style*="font-weight:700"],[style*="font-weight: 900"],[style*="font-weight:900"]){
 font-weight:900!important;-webkit-text-stroke:.65px currentColor!important;text-shadow:0 0 1px currentColor!important;
}
.rich-editor :is(i,em,[style*="font-style: italic"],[style*="font-style:italic"]),
.article.rich-content :is(i,em,[style*="font-style: italic"],[style*="font-style:italic"]){font-style:italic!important;transform:skewX(-9deg)}

/* Custom account owl icon */
#accountBtn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
#accountBtn .account-owl-icon{width:25px;height:25px;object-fit:contain;flex:none;vertical-align:middle}
#accountBtn span{display:inline-block}
/* Keep the account button visually balanced with coupon/admin buttons */
#accountBtn{font-size:14px!important;padding:8px 10px!important;gap:5px!important;min-height:0!important}
#accountBtn .account-owl-icon{width:19px!important;height:19px!important}

/* 2026-11-18: unify the three header action buttons on mobile and desktop */
.top .actions{display:flex;align-items:stretch;gap:8px;min-width:0}
.top .actions > #couponBtn,.top .actions > #accountBtn,.top .actions > #adminBtn{
  box-sizing:border-box!important;height:43px!important;min-height:43px!important;

async function saveNickname(){
 const nickname=($('nicknameInput')?.value.trim()||'').replace(/^\[ROK\]\s*/i,'');
 if(nickname.length<2||nickname.length>20)return showNotice('닉네임은 2~20자로 입력해 주세요.');
 const {error}=await client.from('guide_profiles').upsert({user_id:currentUser.id,nickname},{onConflict:'user_id'});
 if(error)return showNotice('닉네임 저장 실패: '+error.message);
 currentNickname=nickname;refreshNicknameButton();showNotice('닉네임이 저장되었습니다.');accountPanel();
}

}

async function refreshCoupons(){
 const target=$('couponList');if(!target)return;target.innerHTML='<p class="small">쿠폰을 불러오는 중...</p>';
 try{
  const {data,error}=await client.from('coupons').select('id,code,description,created_at').order('created_at',{ascending:false});if(error)throw error;
  let used=new Set();const userId=currentUser?.id||null;
  if(userId){const result=await client.from('coupon_usages').select('coupon_id').eq('user_id',userId);if(result.error)throw result.error;used=new Set((result.data||[]).map(x=>x.coupon_id))}
  else used=new Set(getLocalCouponUses());
  if(!target.isConnected)return;
  const coupons=[...(data||[])];
  const byNewest=(a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||String(b.id).localeCompare(String(a.id));
  if(couponSort==='oldest')coupons.sort((a,b)=>-byNewest(a,b));
  else if(couponSort==='unused')coupons.sort((a,b)=>Number(used.has(a.id))-Number(used.has(b.id))||byNewest(a,b));
  else coupons.sort(byNewest);
  const unusedCount=coupons.filter(c=>!used.has(c.id)).length;
  const usedCount=coupons.length-unusedCount;
  const makeCards=items=>items.map(c=>`<div class="panel" style="margin:10px 0;padding:15px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><strong style="color:var(--gold);overflow-wrap:anywhere">${esc(c.code)}</strong><span class="small">${used.has(c.id)?'✅ 사용완료':'🎟️ 사용 전'}</span></div>${c.description?`<p class="small" style="overflow-wrap:anywhere">${esc(c.description)}</p>`:''}<div class="actions" style="margin-top:10px"><button class="ghost" type="button" data-copy-coupon="${esc(c.id)}">📋 복사</button><button class="${used.has(c.id)?'ghost':'btn'}" type="button" data-use-coupon="${esc(c.id)}">${used.has(c.id)?'사용완료 취소':'사용완료'}</button><button class="ghost" type="button" data-request-delete="${esc(c.id)}">📝 삭제 요청</button>${admin?`<button class="ghost" type="button" data-admin-delete-coupon="${esc(c.id)}">🗑️ 관리자 삭제</button>`:''}</div></div>`).join('');
  target.innerHTML=unusedCount?makeCards(coupons.filter(c=>!used.has(c.id))):'<p class="notice">사용 전 쿠폰이 없습니다.</p>';
  const usedList=$('couponUsedList');
  if(usedList)usedList.innerHTML=usedCount?makeCards(coupons.filter(c=>used.has(c.id))):'<p class="notice">사용완료한 쿠폰이 없습니다.</p>';
  const usedToggle=$('couponUsedToggle');if(usedToggle)usedToggle.textContent=`${couponUsedExpanded?'▼':'▶'} ✅ 사용완료 (${usedCount})`;
  setCouponUsedExpanded();
  const couponActionRoot=$('modalBody');
  couponActionRoot.querySelectorAll('[data-request-delete]').forEach(btn=>btn.onclick=()=>{
    const c=coupons.find(x=>String(x.id)===btn.dataset.requestDelete);if(c)requestCouponDeletion(c);
  });
  couponActionRoot.querySelectorAll('[data-admin-delete-coupon]').forEach(btn=>btn.onclick=async()=>{
    if(!admin)return;const c=coupons.find(x=>String(x.id)===btn.dataset.adminDeleteCoupon);if(c)await adminDeleteCoupon(c);
  });
  couponActionRoot.querySelectorAll('[data-copy-coupon]').forEach(btn=>btn.onclick=async()=>{const c=coupons.find(x=>String(x.id)===btn.dataset.copyCoupon);if(!c)return;try{await navigator.clipboard.writeText(c.code);showNotice('쿠폰코드를 복사했습니다.')}catch{prompt('쿠폰코드를 복사해 주세요.',c.code)}});
  couponActionRoot.querySelectorAll('[data-use-coupon]').forEach(btn=>btn.onclick=async()=>{
   const id=btn.dataset.useCoupon,wasUsed=used.has(id);btn.disabled=true;
   try{
    if(userId){const q=client.from('coupon_usages');const result=wasUsed?await q.delete().eq('user_id',userId).eq('coupon_id',id):await q.insert({user_id:userId,coupon_id:id});if(result.error)throw result.error}
    else{const values=new Set(getLocalCouponUses());if(wasUsed)values.delete(id);else values.add(id);saveLocalCouponUses([...values])}
    await refreshCoupons();
   }catch(err){showNotice('사용완료 상태 저장 실패: '+err.message);btn.disabled=false}
  });
 }catch(err){if(target.isConnected)target.innerHTML=`<p class="notice">쿠폰 목록을 불러오지 못했습니다: ${esc(err.message)}</p>`}
}
function requestCouponDeletion(c){
 openModal('📝 쿠폰 삭제 요청',`<p class="notice">쿠폰: <strong>${esc(c.code)}</strong></p><p class="small">요청이 접수되어도 즉시 삭제되지 않습니다. 관리자가 검토합니다.</p><form id="couponDeleteRequestForm"><div class="field"><label for="couponDeleteReason">삭제 요청 사유</label><select id="couponDeleteReasonType"><option value="잘못된 쿠폰번호">잘못된 쿠폰번호</option><option value="만료된 쿠폰">만료된 쿠폰</option><option value="잘못된 정보">잘못된 정보</option><option value="기타">기타</option></select><textarea id="couponDeleteReason" maxlength="250" style="min-height:90px" placeholder="상세 사유 (선택)"></textarea></div><div class="actions"><button class="btn" type="submit" id="couponRequestSubmit">삭제 요청 보내기</button><button class="ghost" type="button" id="couponRequestBack">쿠폰 목록으로</button></div></form>`);
 $('couponRequestBack').onclick=couponPanel;
 $('couponDeleteRequestForm').onsubmit=async e=>{e.preventDefault();const btn=$('couponRequestSubmit');btn.disabled=true;
  const reason=($('couponDeleteReasonType').value+' '+$('couponDeleteReason').value.trim()).trim();
  try{const {error}=await client.from('coupon_delete_requests').insert({coupon_id:c.id,reason});if(error)throw error;showNotice('삭제 요청이 접수되었습니다. 관리자가 확인한 후 처리합니다.');await couponPanel()}
  catch(err){showNotice('삭제 요청 실패: '+err.message);if(btn.isConnected)btn.disabled=false}
 };
}
async function adminDeleteCoupon(c){
 if(!admin||!confirm(`쿠폰 「${c.code}」을(를) 정말 삭제할까요?\n회원들의 해당 쿠폰 사용 기록과 삭제 요청도 함께 삭제됩니다.`))return;
 try{const {data,error}=await client.from('coupons').delete().eq('id',c.id).select('id');if(error)throw error;if(!data?.length)throw Error('삭제 권한이 없거나 이미 삭제된 쿠폰입니다.');showNotice('쿠폰이 삭제되었습니다.');await couponPanel()}
 catch(err){showNotice('쿠폰 삭제 실패: '+err.message)}
}
async function manageCouponRequests(){
 if(!admin||!client)return;
 openModal('🗑️ 쿠폰 삭제 요청 관리','<p class="small">삭제 요청을 불러오는 중...</p>');
 try{
  const [r,c]=await Promise.all([client.from('coupon_delete_requests').select('id,coupon_id,reason,status,created_at').order('created_at',{ascending:false}),client.from('coupons').select('id,code')]);
  if(r.error)throw r.error;if(c.error)throw c.error;
  const codes=new Map((c.data||[]).map(x=>[x.id,x.code]));const requests=r.data||[];
  $('modalBody').innerHTML=`<p class="small">요청 총 ${requests.length}건 · 승인 시 쿠폰과 관련 사용완료 기록이 삭제됩니다.</p><div id="deleteRequestList"></div><div class="actions" style="margin-top:14px"><button class="ghost" id="deleteRequestBack">← 관리자 페이지</button></div>`;
  $('deleteRequestBack').onclick=adminPanel;
  $('deleteRequestList').innerHTML=requests.length?requests.map(x=>`<div class="panel" style="margin:10px 0"><strong>${esc(codes.get(x.coupon_id)||'삭제된 쿠폰')}</strong><p class="small">${esc(x.reason)} · ${esc(new Date(x.created_at).toLocaleString('ko-KR'))}</p><p class="small">${x.status==='pending'?'⏳ 검토 대기':'↩️ 반려됨'}</p>${x.status==='pending'?`<div class="actions"><button class="btn" data-approve-request="${esc(x.id)}">삭제 승인</button><button class="ghost" data-reject-request="${esc(x.id)}">반려</button></div>`:''}</div>`).join(''):'<p class="notice">접수된 삭제 요청이 없습니다.</p>';
  $('deleteRequestList').querySelectorAll('[data-approve-request]').forEach(b=>b.onclick=async()=>{
   const req=requests.find(x=>x.id===b.dataset.approveRequest);if(!req)return;
   if(!confirm('이 요청을 승인하고 해당 쿠폰을 영구 삭제할까요?'))return;
   b.disabled=true;
   try{const {data,error}=await client.from('coupons').delete().eq('id',req.coupon_id).select('id');if(error)throw error;if(!data?.length)throw Error('쿠폰이 이미 삭제되었거나 삭제 권한이 없습니다.');showNotice('삭제 요청을 승인하고 쿠폰을 삭제했습니다.');await manageCouponRequests()}
   catch(err){showNotice('삭제 승인 실패: '+err.message);if(b.isConnected)b.disabled=false}
  });
  $('deleteRequestList').querySelectorAll('[data-reject-request]').forEach(b=>b.onclick=async()=>{
   if(!confirm('이 삭제 요청을 반려할까요?'))return;b.disabled=true;
   try{const {error}=await client.from('coupon_delete_requests').update({status:'rejected'}).eq('id',b.dataset.rejectRequest);if(error)throw error;showNotice('요청을 반려했습니다.');await manageCouponRequests()}
   catch(err){showNotice('반려 처리 실패: '+err.message);if(b.isConnected)b.disabled=false}
  });
 }catch(err){$('modalBody').innerHTML=`<p class="notice">요청 목록을 불러오지 못했습니다: ${esc(err.message)}</p>`}
}
function search(){query=$('search').value.trim().toLowerCase();if(isCalcCat(category))category='';render()}$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};init();
</script>
<script>
/* Layout-only wiring: existing search, coupon and guide click handlers stay intact. */
(function(){
 const search=document.querySelector('.hero .search');const mount=document.getElementById('sideSearchMount');
 if(search&&mount)mount.appendChild(search);
 const coupon=document.getElementById('couponSideBtn');if(coupon)coupon.addEventListener('click',()=>document.getElementById('couponBtn')?.click());
 const recent=document.getElementById('recentGuides');
 function updateRecent(){if(!recent||typeof posts==='undefined')return;const items=[...posts].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,5);recent.replaceChildren();for(const p of items){const btn=document.createElement('button');btn.type='button';btn.textContent='✒ '+p.title;btn.addEventListener('click',()=>{const guide=document.querySelector('#cards .guide-card');const oldCategory=category;category='';query='';const input=document.getElementById('search');if(input)input.value='';render();const card=[...document.querySelectorAll('#cards .guide-card')].find(c=>c.textContent.includes(p.title));if(card)card.click();else{category=oldCategory;render()}});recent.appendChild(btn)}if(!items.length)recent.textContent='등록된 공략이 없습니다.'}
 const cards=document.getElementById('cards');if(cards)new MutationObserver(updateRecent).observe(cards,{childList:true});
 updateRecent();
})();
</script>

    if(composing||e.isComposing||e.inputType!=='insertText'||!e.data||!(pending.color||pending.bold||pending.italic||pending.underline))return;
    const sel=window.getSelection();if(!sel||!sel.rangeCount||!inside(sel.getRangeAt(0)))return;
    e.preventDefault();const r=sel.getRangeAt(0);r.deleteContents();let node=document.createTextNode(e.data);
    if(pending.bold){const el=document.createElement('strong');el.appendChild(node);node=el}
    if(pending.italic){const el=document.createElement('em');el.appendChild(node);node=el}
    if(pending.underline){const el=document.createElement('u');el.appendChild(node);node=el}
    if(pending.color){const el=document.createElement('span');el.style.color=pending.color;el.appendChild(node);node=el}
    r.insertNode(node);r.setStartAfter(node);r.collapse(true);sel.removeAllRanges();sel.addRange(r);rememberSelection();ed.dispatchEvent(new Event('input',{bubbles:true}));
  });
  // On iOS, Korean IME composition does not always expose insertText. For collapsed
  // selections, create a styled typing container at the caret on focus/tap.
  ed.addEventListener('focus',()=>{if(!(pending.color||pending.bold||pending.italic||pending.underline))return;});

 $('richLink').onclick=()=>{rememberSelection();const url=prompt('링크 주소를 입력하세요 (https://...)');if(!url)return;try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();focusSelection();document.execCommand('createLink',false,u.href);rememberSelection()}catch{showNotice('http 또는 https 주소를 입력해 주세요.')}};

 $('richImageFile').onchange=async()=>{const file=$('richImageFile').files[0];if(!file)return;if(uploading)return;uploading=true;$('postSubmit').disabled=true;$('richStatus').textContent='이미지를 업로드하고 있습니다...';try{const url=await uploadGuideImage(file);focusSelection();const img=document.createElement('img');img.src=url;img.alt=file.name;img.style.maxWidth='100%';const sel=window.getSelection();if(sel&&sel.rangeCount&&ed.contains(sel.anchorNode)){const range=sel.getRangeAt(0);range.deleteContents();range.insertNode(img);range.setStartAfter(img);range.collapse(true);sel.removeAllRanges();sel.addRange(range)}else ed.appendChild(img);ed.appendChild(document.createElement('p'));$('richStatus').textContent='이미지가 본문에 삽입되었습니다.'}catch(err){showNotice(err.message);$('richStatus').textContent='이미지 업로드에 실패했습니다.'}finally{uploading=false;$('postSubmit').disabled=false;$('richImageFile').value=''}};
 $('postForm').onsubmit=async e=>{e.preventDefault();if(uploading)return;const title=$('postTitle').value.trim(),cat=$('postCat').value;const plain=ed.textContent.trim();if(!title||(!plain&&!ed.querySelector('img'))){showNotice('제목과 본문을 입력해 주세요.');return}let content;try{content=RICH_PREFIX+cleanRich(ed.innerHTML)}catch(err){showNotice(err.message);return}let image_url=p?.image_url||null;const submit=$('postSubmit');submit.disabled=true;submit.textContent='저장 중...';try{const file=$('postImage').files[0];if(file)image_url=await uploadGuideImage(file);const payload={title,content,category:cat,image_url};if(client){const response=p?await client.from('guides').update(payload).eq('id',p.id):await client.from('guides').insert(payload);if(response.error)throw response.error;await load()}else{if(p)Object.assign(p,payload);else posts.unshift({...payload,id:crypto.randomUUID()});saveDemo()}closeModal()}catch(err){showNotice(err.message)}finally{submit.disabled=false;submit.textContent='저장하기'}}
}
async function uploadGuideImage(file){if(!client)throw Error('이미지 업로드는 Supabase 연결 후 사용할 수 있습니다.');if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))throw Error('JPG, PNG, WEBP, GIF 이미지만 업로드할 수 있습니다.');if(file.size>5*1024*1024)throw Error('이미지는 5MB 이하로 등록해 주세요.');const path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await client.storage.from('guide-images').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return client.storage.from('guide-images').getPublicUrl(path).data.publicUrl}
function saveDemo(){localStorage.setItem('guide-demo-posts',JSON.stringify(posts));render()}
function adminPanel(){if(!client){openModal('관리자 데모 모드',`<p class="notice">현재 브라우저에서만 저장되는 테스트 모드입니다. 실제 공개 사이트에서 공용 관리 기능을 사용하려면 Supabase를 연결해야 합니다.</p><button class="btn" id="newPost">새 공략 등록</button>`);$('newPost').onclick=()=>editor();return}if(!admin){openModal('관리자 로그인',`<form id="loginForm"><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" required></div><button class="btn">로그인</button></form><p class="small">관리자 계정은 Supabase 대시보드에서 생성합니다.</p>`);$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return showNotice(error.message);closeModal();adminPanel()};return}openModal('관리자 페이지',`<p>등록된 공략: ${posts.length}개</p><div class="actions"><button class="btn" id="newPost">새 공략 등록</button><button class="ghost" id="editSiteBrand">✏️ 사이트 이름 변경</button><button class="ghost" id="logout">로그아웃</button></div><p class="small">기존 공략은 목록에서 자세히 보기 → 수정/삭제로 관리할 수 있습니다.</p>`);$('newPost').onclick=()=>editor();$('editSiteBrand').onclick=editSiteBrand;$('logout').onclick=async()=>{await client.auth.signOut();closeModal()}}
$('adminBtn').onclick=adminPanel;$('couponBtn').onclick=()=>openModal('🎁 쿠폰코드','<p>쿠폰코드 게시판은 관리자 기능에서 추후 확장할 수 있습니다.</p>');function search(){query=$('search').value.trim().toLowerCase();if(category==='계산기')category='';render()}$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};for(const id of ['power','percent','unit','times'])$(id).oninput=calc;function calc(){const power=Number($('power').value)||0,percent=Number($('percent').value)||0,unit=Number($('unit').value)||0,times=Number($('times').value)||0;$('powerResult').textContent=Math.round(power*(1+percent/100)).toLocaleString('ko-KR');$('resourceResult').textContent=(unit*times).toLocaleString('ko-KR')}calc();init();

 if(index<0||other<0||other>=group.length)return;
 [group[index],group[other]]=[group[other],group[index]];
 const targetPinned=!!p.is_pinned;
 let cursor=0;const final=posts.map(x=>!!x.is_pinned===targetPinned?group[cursor++]:x);
 const order=final.map((x,i)=>({id:String(x.id),position:i}));
 try{const {error}=await client.rpc('set_guide_order',{p_order:order});if(error)throw error;await load();adminGuideList()}

async function couponPanel(){

async function refreshCoupons(){
 const target=$('couponList');if(!target)return;target.innerHTML='<p class="small">쿠폰을 불러오는 중...</p>';
 try{
  const {data,error}=await client.from('coupons').select('id,code,description,created_at').order('created_at',{ascending:false});if(error)throw error;
  let used=new Set();const userId=currentUser?.id||null;
  if(userId){const result=await client.from('coupon_usages').select('coupon_id').eq('user_id',userId);if(result.error)throw result.error;used=new Set((result.data||[]).map(x=>x.coupon_id))}
  else used=new Set(getLocalCouponUses());
  if(!target.isConnected)return;
  const coupons=[...(data||[])];
  const byNewest=(a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||String(b.id).localeCompare(String(a.id));
  if(couponSort==='oldest')coupons.sort((a,b)=>-byNewest(a,b));
  else if(couponSort==='unused')coupons.sort((a,b)=>Number(used.has(a.id))-Number(used.has(b.id))||byNewest(a,b));
  else coupons.sort(byNewest);
  target.innerHTML=coupons.length?coupons.map(c=>`<div class="panel" style="margin:10px 0;padding:15px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><strong style="color:var(--gold);overflow-wrap:anywhere">${esc(c.code)}</strong><span class="small">${used.has(c.id)?'✅ 사용완료':'🎟️ 사용 전'}</span></div>${c.description?`<p class="small" style="overflow-wrap:anywhere">${esc(c.description)}</p>`:''}<div class="actions" style="margin-top:10px"><button class="ghost" type="button" data-copy-coupon="${esc(c.id)}">📋 복사</button><button class="${used.has(c.id)?'ghost':'btn'}" type="button" data-use-coupon="${esc(c.id)}">${used.has(c.id)?'사용완료 취소':'사용완료'}</button><button class="ghost" type="button" data-request-delete="${esc(c.id)}">📝 삭제 요청</button>${admin?`<button class="ghost" type="button" data-admin-delete-coupon="${esc(c.id)}">🗑️ 관리자 삭제</button>`:''}</div></div>`).join(''):'<p class="notice">아직 등록된 쿠폰이 없습니다. 첫 쿠폰을 등록해 보세요!</p>';
  target.querySelectorAll('[data-request-delete]').forEach(btn=>btn.onclick=()=>{
    const c=coupons.find(x=>String(x.id)===btn.dataset.requestDelete);if(c)requestCouponDeletion(c);
  });
  target.querySelectorAll('[data-admin-delete-coupon]').forEach(btn=>btn.onclick=async()=>{
    if(!admin)return;const c=coupons.find(x=>String(x.id)===btn.dataset.adminDeleteCoupon);if(c)await adminDeleteCoupon(c);
  });
  target.querySelectorAll('[data-copy-coupon]').forEach(btn=>btn.onclick=async()=>{const c=coupons.find(x=>String(x.id)===btn.dataset.copyCoupon);if(!c)return;try{await navigator.clipboard.writeText(c.code);showNotice('쿠폰코드를 복사했습니다.')}catch{prompt('쿠폰코드를 복사해 주세요.',c.code)}});
  target.querySelectorAll('[data-use-coupon]').forEach(btn=>btn.onclick=async()=>{
   const id=btn.dataset.useCoupon,wasUsed=used.has(id);btn.disabled=true;
   try{
    if(userId){const q=client.from('coupon_usages');const result=wasUsed?await q.delete().eq('user_id',userId).eq('coupon_id',id):await q.insert({user_id:userId,coupon_id:id});if(result.error)throw result.error}
    else{const values=new Set(getLocalCouponUses());if(wasUsed)values.delete(id);else values.add(id);saveLocalCouponUses([...values])}
    await refreshCoupons();
   }catch(err){showNotice('사용완료 상태 저장 실패: '+err.message);btn.disabled=false}
  });
 }catch(err){if(target.isConnected)target.innerHTML=`<p class="notice">쿠폰 목록을 불러오지 못했습니다: ${esc(err.message)}</p>`}
}

  $('deleteRequestList').querySelectorAll('[data-approve-request]').forEach(b=>b.onclick=async()=>{
   const req=requests.find(x=>x.id===b.dataset.approveRequest);if(!req)return;
   if(!confirm('이 요청을 승인하고 해당 쿠폰을 영구 삭제할까요?'))return;
   b.disabled=true;
   try{const {data,error}=await client.from('coupons').delete().eq('id',req.coupon_id).select('id');if(error)throw error;if(!data?.length)throw Error('쿠폰이 이미 삭제되었거나 삭제 권한이 없습니다.');showNotice('삭제 요청을 승인하고 쿠폰을 삭제했습니다.');await manageCouponRequests()}
   catch(err){showNotice('삭제 승인 실패: '+err.message);if(b.isConnected)b.disabled=false}
  });
  $('deleteRequestList').querySelectorAll('[data-reject-request]').forEach(b=>b.onclick=async()=>{
   if(!confirm('이 삭제 요청을 반려할까요?'))return;b.disabled=true;
   try{const {error}=await client.from('coupon_delete_requests').update({status:'rejected'}).eq('id',b.dataset.rejectRequest);if(error)throw error;showNotice('요청을 반려했습니다.');await manageCouponRequests()}
   catch(err){showNotice('반려 처리 실패: '+err.message);if(b.isConnected)b.disabled=false}
  });
 }catch(err){$('modalBody').innerHTML=`<p class="notice">요청 목록을 불러오지 못했습니다: ${esc(err.message)}</p>`}
}
function search(){query=$('search').value.trim().toLowerCase();if(category==='계산기')category='';render()}$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};for(const id of ['power','percent','unit','times'])$(id).oninput=calc;function calc(){const power=Number($('power').value)||0,percent=Number($('percent').value)||0,unit=Number($('unit').value)||0,times=Number($('times').value)||0;$('powerResult').textContent=Math.round(power*(1+percent/100)).toLocaleString('ko-KR');$('resourceResult').textContent=(unit*times).toLocaleString('ko-KR')}calc();init();
</script></body></html>

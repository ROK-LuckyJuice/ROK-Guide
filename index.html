/* 공략 목록 카드 개선: 기존 데이터 및 편집기 유지 */
.cards{align-items:stretch}
.card.guide-card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;cursor:pointer}
.card.guide-card:hover{transform:translateY(-3px);border-color:#b99554;box-shadow:0 12px 26px #0004}
.card.guide-card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.guide-cover{aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,#34465c,#172335);display:flex;align-items:center;justify-content:center;position:relative}
.guide-cover img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
.guide-card:hover .guide-cover img{transform:scale(1.035)}
.guide-cover-placeholder{font-size:52px;line-height:1;text-shadow:0 4px 12px #0007}
.guide-card-body{padding:18px 19px 20px;display:flex;flex-direction:column;flex:1;gap:9px}
.guide-card .tag{font-weight:700;letter-spacing:.02em}
.guide-card h3{margin:0;font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.guide-card p{margin:0;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:3.2em;overflow-wrap:anywhere}
.guide-card .guide-open{margin-top:auto;align-self:flex-start;color:var(--gold);font-size:13px;font-weight:800;padding-top:7px}
@media(max-width:700px){.guide-card-body{padding:17px}.guide-cover-placeholder{font-size:48px}}
@media(prefers-reduced-motion:reduce){.card.guide-card,.guide-cover img{transition:none}}
/* 대표 이미지 관리 */
.cover-manager{display:grid;gap:10px;padding:12px;border:1px solid var(--edge);border-radius:12px;background:#111d2c}
.cover-preview{width:100%;max-height:230px;aspect-ratio:16/9;object-fit:contain;background:#0b1420;border-radius:9px}
.cover-empty{padding:25px 12px;text-align:center;color:var(--muted);border:1px dashed var(--edge);border-radius:9px}
.cover-hint{font-size:12px;color:var(--muted);line-height:1.6}

/* 공략 임시저장 및 복구 */
.draft-manager{display:grid;gap:9px;padding:12px;margin:12px 0;background:#102538;border:1px solid #536078;border-radius:12px}
.draft-manager .actions{align-items:center}
.draft-status{font-size:12px;color:var(--muted);line-height:1.5}
.draft-manager .ghost{padding:8px 11px}

/* 관리자 공략 관리 목록 */
.admin-guide-item .order-actions{display:flex;gap:5px;flex-wrap:wrap}.admin-guide-item .order-actions button{padding:7px 9px}.pin-label{color:#e7c278;font-size:12px;font-weight:700}
.admin-guide-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px);gap:8px;margin:14px 0}
.admin-guide-controls input,.admin-guide-controls select{width:100%;min-width:0}
.admin-guide-list{display:grid;gap:9px;max-height:48vh;overflow:auto}
.admin-guide-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#101b2b;border:1px solid var(--edge);border-radius:11px;padding:12px}
.admin-guide-info{min-width:0;flex:1}.admin-guide-info strong{display:block;overflow-wrap:anywhere;margin:4px 0}.admin-guide-info .small{font-size:12px}
.admin-guide-item .actions{flex-shrink:0}.admin-guide-item .ghost{padding:8px 10px}
@media(max-width:550px){.admin-guide-item{align-items:flex-start;flex-direction:column}.admin-guide-controls{grid-template-columns:1fr}}

/* 공략 자동 목차: 저장된 본문은 수정하지 않고 표시 시에만 생성 */
.guide-toc{background:#102538;border:1px solid #536078;border-radius:12px;padding:15px 17px;margin:15px 0 22px}
.guide-toc-title{font-weight:800;color:var(--gold);margin-bottom:9px}
.guide-toc-list{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.guide-toc-item button{display:block;width:100%;text-align:left;border:0;border-radius:7px;background:transparent;color:#dce8f5;padding:7px 9px;line-height:1.5;overflow-wrap:anywhere}
.guide-toc-item button:hover,.guide-toc-item button:focus-visible{background:#29415b;outline:2px solid #e7c27855}
.guide-toc-item.level-3{padding-left:17px;font-size:14px}
.guide-toc-target{scroll-margin-top:18px}
.guide-toc-back{display:block;margin:10px 0 17px;color:var(--gold);background:transparent;border:0;padding:5px 0;font-size:13px}

/* Real three-column open-book layout, preserving all existing application IDs. */
body{background:radial-gradient(ellipse at top,#493022 0%,#1a100d 62%,#100b09 100%)}
.wrap{max-width:1480px;padding:18px 22px 55px}
.top{background:linear-gradient(#39251b,#1b120e);border:2px ridge #9d7037;padding:14px 24px;border-radius:7px}
.hero{min-height:185px;margin:10px 0 0;background:radial-gradient(ellipse at 70% 20%,#8e674b66,transparent 60%),linear-gradient(115deg,#23150f,#4e3020,#211510);border:2px solid #a8793b;border-radius:8px 8px 0 0;padding:30px 16px}
.hero h1{font-family:Georgia,'Malgun Gothic',serif;color:#f9d78f}
.hero .search{display:none}
.book-layout{display:grid;grid-template-columns:minmax(195px,23%) minmax(0,1fr) minmax(210px,24%);gap:0;align-items:stretch;min-height:660px;background:#cfab71;border:11px solid #3b2316;border-radius:22px 22px 34px 34px;box-shadow:0 0 0 3px #b58a47,0 22px 42px #000b;overflow:hidden}
.book-left,.book-center,.book-right{min-width:0;padding:28px 20px 36px;color:#43291a;background-color:#e6c997;background-image:radial-gradient(ellipse at 14% 20%,#fff8d29c,transparent 53%),radial-gradient(ellipse at 90% 88%,#99653642,transparent 55%),repeating-linear-gradient(25deg,#6e421008 0 1px,transparent 1px 7px),linear-gradient(100deg,#d3ab6f,#f0d6a6 18%,#ecd1a0 84%,#c49a60)}
.book-left{border-right:4px solid #b78b55;box-shadow:inset -12px 0 18px #5d37172e}
.book-center{border-right:4px solid #b78b55;box-shadow:inset 12px 0 16px #8a55282e,inset -10px 0 16px #8a55282e}
.book-right{box-shadow:inset 10px 0 17px #5d37172e}
.book-label,.side-paper h2{font-size:19px;color:#4b2718;font-family:Georgia,'Malgun Gothic',serif;text-align:center;margin:0 0 20px;border-bottom:2px double #9b693b;padding-bottom:14px}
.book-layout .cats{display:flex;flex-direction:column;gap:10px;margin:0}
.book-layout .cat{min-height:0!important;padding:13px 12px!important;display:flex;align-items:center;gap:10px;border-radius:5px!important;text-align:left;font-size:15px!important;color:#452918!important;background:linear-gradient(160deg,#f7e5bc,#d3ad70)!important;border:2px solid #9b713c!important;box-shadow:inset 0 0 0 2px #f9e4b7,0 3px 4px #59381855!important}
.book-layout .cat span{display:inline-flex!important;min-height:0!important;margin:0!important;font-size:22px!important;flex:0 0 34px}
.book-layout .cat.active{background:linear-gradient(150deg,#71301e,#3b1915)!important;color:#ffe8b2!important;border-color:#d3a554!important}
.book-center .section{margin:0 0 22px;padding:8px 0 15px;border-bottom:2px solid #ac814f}
.book-center .section h2{font-size:30px;color:#502819!important;font-family:Georgia,'Malgun Gothic',serif}
.book-center .small{color:#775536}

// 카테고리 관리: SQL 적용 전에는 기본 카테고리를 표시합니다.
async function loadCategories(){
 if(!client)return;
 const {data,error}=await client.from('guide_categories').select('id,name,emoji,image_url,sort_order,is_calculator').order('sort_order',{ascending:true});
 if(error){console.warn('카테고리 설정을 불러오지 못했습니다. SQL 적용 여부를 확인하세요.',error.message);return}
 if(data?.length){categoryItems=data;syncCats();render()}
}
const CATEGORY_EMOJIS=['🌱','👑','⚔️','🛡️','🧮','🏹','📖','🔮','🔥','💎','🏆','🎯','💡','📢','🎁','⭐','📚','🗺️','🪄','🚀','📁','🧙'];
function manageCategories(){
 if(!admin||!client)return;
 let draft=categoryItems.map(c=>({...c}));let pendingImages=new Map();let busy=false;
 openModal('📂 카테고리 관리',`<p class="small">▲ ▼ 순서 변경 · 이름 변경 · 이모지 선택 · 이미지 업로드 · 카테고리 추가. 변경사항은 저장하기를 눌러야 적용됩니다. 삭제는 확인 후 즉시 적용됩니다.</p><div id="categoryManageRows"></div><div class="panel" style="margin-top:15px"><h3>➕ 새 카테고리</h3><div class="field"><label for="newCategoryName">카테고리 이름</label><input id="newCategoryName" maxlength="40" placeholder="새 카테고리 이름"></div><div class="field"><label for="newCategoryEmoji">아이콘 이모지</label><select id="newCategoryEmoji">${CATEGORY_EMOJIS.map(e=>`<option value="${e}">${e}</option>`).join('')}</select></div><button class="ghost" id="addCategory" type="button">카테고리 추가</button></div><div class="actions" style="margin-top:16px"><button class="btn" id="saveCategories">💾 변경사항 저장</button><button class="ghost" id="cancelCategories">취소</button></div><p class="small" id="categoryStatus">이미지 파일은 저장 시 업로드됩니다. PNG/JPG/WEBP, 2MB 이하.</p>`);
 const rows=$('categoryManageRows');
 function redraw(){
  rows.innerHTML=draft.map((c,i)=>`<div class="panel" style="margin:10px 0;padding:13px"><div class="actions" style="align-items:center;justify-content:space-between"><strong>${i+1}. ${esc(c.name)}</strong><div class="actions"><button class="ghost" data-cat-up="${esc(c.id)}" ${i===0?'disabled':''}>▲</button><button class="ghost" data-cat-down="${esc(c.id)}" ${i===draft.length-1?'disabled':''}>▼</button></div></div><div class="field"><label>이름 ${c.is_calculator?'(계산기 기능 유지)':''}</label><input data-cat-name="${esc(c.id)}" maxlength="40" value="${esc(c.name)}"></div><div class="actions" style="align-items:center"><span data-cat-preview="${esc(c.id)}" style="font-size:30px">${categoryIcon(c)}</span><select data-cat-emoji="${esc(c.id)}" aria-label="이모지 선택">${CATEGORY_EMOJIS.map(e=>`<option value="${e}" ${e===c.emoji?'selected':''}>${e}</option>`).join('')}</select></div><div class="field"><label>이미지 아이콘 업로드</label><input type="file" accept="image/png,image/jpeg,image/webp" data-cat-file="${esc(c.id)}"></div>${c.image_url?`<button class="ghost" type="button" data-cat-remove="${esc(c.id)}">이미지 제거 · 이모지로 전환</button>`:''}<div class="actions" style="margin-top:10px"><button class="ghost" type="button" data-cat-delete="${esc(c.id)}" ${c.is_calculator?'disabled title="계산기는 삭제할 수 없습니다"':''}>🗑️ 카테고리 삭제</button></div></div>`).join('');
  rows.querySelectorAll('[data-cat-delete]').forEach(el=>el.onclick=async()=>{
   if(busy)return;
   const c=draft.find(x=>x.id===el.dataset.catDelete);if(!c||c.is_calculator)return;
   const persisted=categoryItems.some(x=>x.id===c.id);
   if(!persisted){if(!confirm(`아직 저장하지 않은 「${c.name}」 카테고리를 목록에서 제거할까요?`))return;draft=draft.filter(x=>x.id!==c.id);pendingImages.delete(c.id);redraw();return}
   // 삭제 전 다른 변경 사항을 저장해야 한다면 먼저 일반 저장을 사용합니다.
   const unsaved=draft.length!==categoryItems.length||draft.some((x,i)=>{
     const y=categoryItems[i];return !y||x.id!==y.id||x.name!==y.name||x.emoji!==y.emoji||x.image_url!==y.image_url||pendingImages.has(x.id);
   });
   if(unsaved){showNotice('저장하지 않은 변경사항이 있습니다. 먼저 변경사항 저장을 누른 뒤 삭제해 주세요.');return}
   const related=posts.filter(p=>p.category===c.name);
   const others=categoryItems.filter(x=>x.id!==c.id&&!x.is_calculator);
   if(related.length&&!others.length){showNotice('공략을 옮길 다른 카테고리가 없어 삭제할 수 없습니다.');return}
   let target=null;
   if(related.length){
     const choices=others.map((x,i)=>`${i+1}. ${x.name}`).join('\n');
     const answer=prompt(`「${c.name}」에 공략 ${related.length}개가 있습니다.\n옮길 카테고리 번호를 입력하세요.\n\n${choices}`);
     if(answer===null)return;
     const index=Number(answer)-1;
     if(!Number.isInteger(index)||!others[index]){showNotice('올바른 카테고리 번호를 입력해 주세요.');return}
     target=others[index];
   }
   if(!confirm(`「${c.name}」 카테고리를 삭제할까요?${related.length?`\n공략 ${related.length}개를 「${target.name}」(으)로 이동합니다.`:'\n이 카테고리에 등록된 공략은 없습니다.'}\n\n공략 내용과 이미지는 삭제되지 않습니다.`))return;
   busy=true;el.disabled=true;
   try{
     const {data,error}=await client.rpc('delete_guide_category_safe',{p_category_id:c.id,p_target_id:target?.id||null});
     if(error)throw error;
     await loadCategories();await load();
     if(category===c.name)category='';render();
     showNotice(`카테고리를 삭제했습니다.${data?.moved_count?` 공략 ${data.moved_count}개를 이동했습니다.`:''}`);
     manageCategories();
   }catch(e){showNotice('카테고리 삭제 실패: '+e.message+'\n삭제 기능 SQL이 실행되었는지 확인해 주세요.');el.disabled=false}
   finally{busy=false}
  });
  rows.querySelectorAll('[data-cat-name]').forEach(el=>el.oninput=()=>{const c=draft.find(x=>x.id===el.dataset.catName);if(c)c.name=el.value});
  rows.querySelectorAll('[data-cat-up],[data-cat-down]').forEach(el=>el.onclick=()=>{const id=el.dataset.catUp||el.dataset.catDown,i=draft.findIndex(x=>x.id===id),j=i+(el.dataset.catUp?-1:1);if(j<0||j>=draft.length)return;[draft[i],draft[j]]=[draft[j],draft[i]];redraw()});
  rows.querySelectorAll('[data-cat-emoji]').forEach(el=>el.onchange=()=>{const c=draft.find(x=>x.id===el.dataset.catEmoji);if(!c)return;c.emoji=el.value;c.image_url=null;pendingImages.delete(c.id);redraw()});
  rows.querySelectorAll('[data-cat-remove]').forEach(el=>el.onclick=()=>{const c=draft.find(x=>x.id===el.dataset.catRemove);if(c){c.image_url=null;pendingImages.delete(c.id);redraw()}});
  rows.querySelectorAll('[data-cat-file]').forEach(el=>el.onchange=()=>{const f=el.files?.[0],c=draft.find(x=>x.id===el.dataset.catFile);if(!f||!c)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2*1024*1024){showNotice('PNG, JPG, WEBP 이미지 2MB 이하만 가능합니다.');el.value='';return}pendingImages.set(c.id,f);const preview=rows.querySelector(`[data-cat-preview="${CSS.escape(c.id)}"]`);if(preview){preview.replaceChildren();const img=document.createElement('img');img.src=URL.createObjectURL(f);img.style.cssText='width:42px;height:42px;object-fit:contain';img.onload=()=>URL.revokeObjectURL(img.src);preview.appendChild(img)}});
 }
 $('addCategory').onclick=()=>{const name=$('newCategoryName').value.trim(),emoji=$('newCategoryEmoji').value;if(!name||name.length>40){showNotice('카테고리 이름은 1~40자로 입력해 주세요.');return}if(draft.some(c=>c.name.trim()===name)){showNotice('이미 있는 카테고리 이름입니다.');return}draft.push({id:crypto.randomUUID(),name,emoji,image_url:null,is_calculator:false});$('newCategoryName').value='';redraw()};
 $('cancelCategories').onclick=adminPanel;
 $('saveCategories').onclick=async()=>{
  if(busy)return;
  draft.forEach(c=>c.name=c.name.trim());
  if(draft.some(c=>!c.name||c.name.length>40)||new Set(draft.map(c=>c.name)).size!==draft.length){showNotice('카테고리 이름은 1~40자이며 중복될 수 없습니다.');return}
  busy=true;const btn=$('saveCategories');btn.disabled=true;
  try{
   for(const c of draft){const f=pendingImages.get(c.id);if(!f)continue;const path=`category-icons/${crypto.randomUUID()}.${f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg'}`;const r=await client.storage.from('guide-images').upload(path,f,{upsert:false,contentType:f.type});if(r.error)throw Error('아이콘 이미지 업로드 실패: '+r.error.message);c.image_url=client.storage.from('guide-images').getPublicUrl(path).data.publicUrl}
   const payload=draft.map((c,i)=>({id:c.id,name:c.name,emoji:c.emoji,image_url:c.image_url,sort_order:i,is_calculator:!!c.is_calculator}));
   const {error}=await client.rpc('save_guide_categories',{p_categories:payload});if(error)throw error;
   await loadCategories();await load();if(category&&!categoryItems.some(c=>c.name===category))category='';render();showNotice('카테고리 변경사항이 저장되었습니다.');adminPanel();
  }catch(e){showNotice('카테고리 저장 실패: '+e.message+'\nSupabase SQL 설정과 이미지 업로드 권한을 확인해 주세요.')}
  finally{busy=false;if(btn.isConnected)btn.disabled=false}
 };
 redraw();
}

 if(!currentUser){accountPanel();return}

 $('newPost').onclick=()=>editor();$('manageGuides').onclick=adminGuideList;$('manageCategories').onclick=manageCategories;$('editSiteBrand').onclick=editSiteBrand;$('manageCouponRequests').onclick=manageCouponRequests;
 $('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error)return showNotice(error.message);closeModal()};

$('adminBtn').onclick=adminPanel;$('couponBtn').onclick=couponPanel;
const COUPON_LOCAL_KEY='rok-guide-coupon-used-v1';
let couponSort='newest';
function getLocalCouponUses(){try{return JSON.parse(localStorage.getItem(COUPON_LOCAL_KEY)||'[]')}catch{return []}}
function saveLocalCouponUses(values){try{localStorage.setItem(COUPON_LOCAL_KEY,JSON.stringify(values))}catch(e){showNotice('이 브라우저에 사용완료 상태를 저장할 수 없습니다.')}}
async function couponPanel(){
 if(!client){showNotice('쿠폰 서비스에 연결되지 않았습니다.');return}
 openModal('🎁 쿠폰코드',`<p class="small">누구나 쿠폰을 등록하고 복사할 수 있습니다. 사용완료 상태는 ${currentUser?'로그인 계정에 저장되어 다른 기기에서도 유지됩니다.':'현재 브라우저에 저장됩니다. 다른 기기와 동기화하려면 로그인해 주세요.'}</p><form id="couponForm"><div class="field"><label for="couponCode">쿠폰코드</label><input id="couponCode" maxlength="100" required autocomplete="off" placeholder="쿠폰코드 입력"></div><div class="field"><label for="couponDescription">설명 (선택)</label><input id="couponDescription" maxlength="300" placeholder="쿠폰 정보"></div><button class="btn" type="submit" id="couponSubmit">쿠폰 등록</button></form><hr style="border:0;border-top:1px solid #40536a;margin:20px 0"><div class="section" style="flex-wrap:wrap"><h3 style="margin:0">등록된 쿠폰</h3><div class="actions" style="align-items:center"><label for="couponSort" class="small">정렬</label><select id="couponSort" aria-label="쿠폰 정렬" style="padding:9px"><option value="newest">최신순</option><option value="oldest">오래된순</option><option value="unused">미사용 우선</option></select><button class="ghost" type="button" id="couponRefresh">새로고침</button></div></div><div id="couponList" aria-live="polite"><p class="small">쿠폰을 불러오는 중...</p></div>`);
 $('couponRefresh').onclick=refreshCoupons;
 $('couponSort').value=couponSort;
 $('couponSort').onchange=()=>{couponSort=$('couponSort').value;refreshCoupons()};
 $('couponForm').onsubmit=async e=>{
  e.preventDefault();const code=$('couponCode').value.trim(),description=$('couponDescription').value.trim();
  if(!code||code.length>100||description.length>300){showNotice('쿠폰코드는 1~100자, 설명은 300자 이하로 입력해 주세요.');return}
  const btn=$('couponSubmit');btn.disabled=true;
  try{const {error}=await client.from('coupons').insert({code,description});if(error){if(error.code==='23505')throw Error('이미 등록된 쿠폰코드입니다.');throw error}$('couponCode').value='';$('couponDescription').value='';await refreshCoupons();showNotice('쿠폰이 등록되었습니다.')}
  catch(err){showNotice('쿠폰 등록 실패: '+err.message)}finally{if(btn.isConnected)btn.disabled=false}
 };
 await refreshCoupons();
}
async function refreshCoupons(){
 const target=$('couponList');if(!target)return;target.innerHTML='<p class="small">쿠폰을 불러오는 중...</p>';
 try{
  const {data,error}=await client.from('coupons').select('id,code,description,created_at').order('created_at',{ascending:false});if(error)throw error;
  let used=new Set();const userId=currentUser?.id||null;
  if(userId){const result=await client.from('coupon_usages').select('coupon_id').eq('user_id',userId);if(result.error)throw result.error;used=new Set((result.data||[]).map(x=>x.coupon_id))}
  else used=new Set(getLocalCouponUses());
  if(!target.isConnected)return;
  const coupons=[...(data||[])];
  const byNewest=(a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||String(b.id).localeCompare(String(a.id));
  if(couponSort==='oldest')coupons.sort((a,b)=>-byNewest(a,b));
  else if(couponSort==='unused')coupons.sort((a,b)=>Number(used.has(a.id))-Number(used.has(b.id))||byNewest(a,b));
  else coupons.sort(byNewest);
  target.innerHTML=coupons.length?coupons.map(c=>`<div class="panel" style="margin:10px 0;padding:15px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><strong style="color:var(--gold);overflow-wrap:anywhere">${esc(c.code)}</strong><span class="small">${used.has(c.id)?'✅ 사용완료':'🎟️ 사용 전'}</span></div>${c.description?`<p class="small" style="overflow-wrap:anywhere">${esc(c.description)}</p>`:''}<div class="actions" style="margin-top:10px"><button class="ghost" type="button" data-copy-coupon="${esc(c.id)}">📋 복사</button><button class="${used.has(c.id)?'ghost':'btn'}" type="button" data-use-coupon="${esc(c.id)}">${used.has(c.id)?'사용완료 취소':'사용완료'}</button><button class="ghost" type="button" data-request-delete="${esc(c.id)}">📝 삭제 요청</button>${admin?`<button class="ghost" type="button" data-admin-delete-coupon="${esc(c.id)}">🗑️ 관리자 삭제</button>`:''}</div></div>`).join(''):'<p class="notice">아직 등록된 쿠폰이 없습니다. 첫 쿠폰을 등록해 보세요!</p>';
  target.querySelectorAll('[data-request-delete]').forEach(btn=>btn.onclick=()=>{
    const c=coupons.find(x=>String(x.id)===btn.dataset.requestDelete);if(c)requestCouponDeletion(c);
  });
  target.querySelectorAll('[data-admin-delete-coupon]').forEach(btn=>btn.onclick=async()=>{
    if(!admin)return;const c=coupons.find(x=>String(x.id)===btn.dataset.adminDeleteCoupon);if(c)await adminDeleteCoupon(c);
  });
  target.querySelectorAll('[data-copy-coupon]').forEach(btn=>btn.onclick=async()=>{const c=coupons.find(x=>String(x.id)===btn.dataset.copyCoupon);if(!c)return;try{await navigator.clipboard.writeText(c.code);showNotice('쿠폰코드를 복사했습니다.')}catch{prompt('쿠폰코드를 복사해 주세요.',c.code)}});
  target.querySelectorAll('[data-use-coupon]').forEach(btn=>btn.onclick=async()=>{
   const id=btn.dataset.useCoupon,wasUsed=used.has(id);btn.disabled=true;
   try{
    if(userId){const q=client.from('coupon_usages');const result=wasUsed?await q.delete().eq('user_id',userId).eq('coupon_id',id):await q.insert({user_id:userId,coupon_id:id});if(result.error)throw result.error}
    else{const values=new Set(getLocalCouponUses());if(wasUsed)values.delete(id);else values.add(id);saveLocalCouponUses([...values])}
    await refreshCoupons();
   }catch(err){showNotice('사용완료 상태 저장 실패: '+err.message);btn.disabled=false}
  });
 }catch(err){if(target.isConnected)target.innerHTML=`<p class="notice">쿠폰 목록을 불러오지 못했습니다: ${esc(err.message)}</p>`}
}
function requestCouponDeletion(c){
 openModal('📝 쿠폰 삭제 요청',`<p class="notice">쿠폰: <strong>${esc(c.code)}</strong></p><p class="small">요청이 접수되어도 즉시 삭제되지 않습니다. 관리자가 검토합니다.</p><form id="couponDeleteRequestForm"><div class="field"><label for="couponDeleteReason">삭제 요청 사유</label><select id="couponDeleteReasonType"><option value="잘못된 쿠폰번호">잘못된 쿠폰번호</option><option value="만료된 쿠폰">만료된 쿠폰</option><option value="잘못된 정보">잘못된 정보</option><option value="기타">기타</option></select><textarea id="couponDeleteReason" maxlength="250" style="min-height:90px" placeholder="상세 사유 (선택)"></textarea></div><div class="actions"><button class="btn" type="submit" id="couponRequestSubmit">삭제 요청 보내기</button><button class="ghost" type="button" id="couponRequestBack">쿠폰 목록으로</button></div></form>`);
 $('couponRequestBack').onclick=couponPanel;
 $('couponDeleteRequestForm').onsubmit=async e=>{e.preventDefault();const btn=$('couponRequestSubmit');btn.disabled=true;
  const reason=($('couponDeleteReasonType').value+' '+$('couponDeleteReason').value.trim()).trim();
  try{const {error}=await client.from('coupon_delete_requests').insert({coupon_id:c.id,reason});if(error)throw error;showNotice('삭제 요청이 접수되었습니다. 관리자가 확인한 후 처리합니다.');await couponPanel()}
  catch(err){showNotice('삭제 요청 실패: '+err.message);if(btn.isConnected)btn.disabled=false}
 };
}
async function adminDeleteCoupon(c){
 if(!admin||!confirm(`쿠폰 「${c.code}」을(를) 정말 삭제할까요?\n회원들의 해당 쿠폰 사용 기록과 삭제 요청도 함께 삭제됩니다.`))return;
 try{const {data,error}=await client.from('coupons').delete().eq('id',c.id).select('id');if(error)throw error;if(!data?.length)throw Error('삭제 권한이 없거나 이미 삭제된 쿠폰입니다.');showNotice('쿠폰이 삭제되었습니다.');await couponPanel()}
 catch(err){showNotice('쿠폰 삭제 실패: '+err.message)}
}
async function manageCouponRequests(){
 if(!admin||!client)return;
 openModal('🗑️ 쿠폰 삭제 요청 관리','<p class="small">삭제 요청을 불러오는 중...</p>');
 try{
  const [r,c]=await Promise.all([client.from('coupon_delete_requests').select('id,coupon_id,reason,status,created_at').order('created_at',{ascending:false}),client.from('coupons').select('id,code')]);
  if(r.error)throw r.error;if(c.error)throw c.error;
  const codes=new Map((c.data||[]).map(x=>[x.id,x.code]));const requests=r.data||[];
  $('modalBody').innerHTML=`<p class="small">요청 총 ${requests.length}건 · 승인 시 쿠폰과 관련 사용완료 기록이 삭제됩니다.</p><div id="deleteRequestList"></div><div class="actions" style="margin-top:14px"><button class="ghost" id="deleteRequestBack">← 관리자 페이지</button></div>`;
  $('deleteRequestBack').onclick=adminPanel;
  $('deleteRequestList').innerHTML=requests.length?requests.map(x=>`<div class="panel" style="margin:10px 0"><strong>${esc(codes.get(x.coupon_id)||'삭제된 쿠폰')}</strong><p class="small">${esc(x.reason)} · ${esc(new Date(x.created_at).toLocaleString('ko-KR'))}</p><p class="small">${x.status==='pending'?'⏳ 검토 대기':'↩️ 반려됨'}</p>${x.status==='pending'?`<div class="actions"><button class="btn" data-approve-request="${esc(x.id)}">삭제 승인</button><button class="ghost" data-reject-request="${esc(x.id)}">반려</button></div>`:''}</div>`).join(''):'<p class="notice">접수된 삭제 요청이 없습니다.</p>';
  $('deleteRequestList').querySelectorAll('[data-approve-request]').forEach(b=>b.onclick=async()=>{
   const req=requests.find(x=>x.id===b.dataset.approveRequest);if(!req)return;
   if(!confirm('이 요청을 승인하고 해당 쿠폰을 영구 삭제할까요?'))return;
   b.disabled=true;
   try{const {data,error}=await client.from('coupons').delete().eq('id',req.coupon_id).select('id');if(error)throw error;if(!data?.length)throw Error('쿠폰이 이미 삭제되었거나 삭제 권한이 없습니다.');showNotice('삭제 요청을 승인하고 쿠폰을 삭제했습니다.');await manageCouponRequests()}
   catch(err){showNotice('삭제 승인 실패: '+err.message);if(b.isConnected)b.disabled=false}
  });
  $('deleteRequestList').querySelectorAll('[data-reject-request]').forEach(b=>b.onclick=async()=>{
   if(!confirm('이 삭제 요청을 반려할까요?'))return;b.disabled=true;
   try{const {error}=await client.from('coupon_delete_requests').update({status:'rejected'}).eq('id',b.dataset.rejectRequest);if(error)throw error;showNotice('요청을 반려했습니다.');await manageCouponRequests()}
   catch(err){showNotice('반려 처리 실패: '+err.message);if(b.isConnected)b.disabled=false}
  });
 }catch(err){$('modalBody').innerHTML=`<p class="notice">요청 목록을 불러오지 못했습니다: ${esc(err.message)}</p>`}
}
function search(){query=$('search').value.trim().toLowerCase();if(isCalcCat(category))category='';render()}$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};for(const id of ['power','percent','unit','times'])$(id).oninput=calc;function calc(){const power=Number($('power').value)||0,percent=Number($('percent').value)||0,unit=Number($('unit').value)||0,times=Number($('times').value)||0;$('powerResult').textContent=Math.round(power*(1+percent/100)).toLocaleString('ko-KR');$('resourceResult').textContent=(unit*times).toLocaleString('ko-KR')}calc();init();
</script>
<script>
/* Layout-only wiring: existing search, coupon and guide click handlers stay intact. */
(function(){
 const search=document.querySelector('.hero .search');const mount=document.getElementById('sideSearchMount');
 if(search&&mount)mount.appendChild(search);
 const coupon=document.getElementById('couponSideBtn');if(coupon)coupon.addEventListener('click',()=>document.getElementById('couponBtn')?.click());

 function updateRecent(){if(!recent||typeof posts==='undefined')return;const items=[...posts].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,5);recent.replaceChildren();for(const p of items){const btn=document.createElement('button');btn.type='button';btn.textContent='✒ '+p.title;btn.addEventListener('click',()=>{const guide=document.querySelector('#cards .guide-card');const oldCategory=category;category='';query='';const input=document.getElementById('search');if(input)input.value='';render();const card=[...document.querySelectorAll('#cards .guide-card')].find(c=>c.textContent.includes(p.title));if(card)card.click();else{category=oldCategory;render()}});recent.appendChild(btn)}if(!items.length)recent.textContent='등록된 공략이 없습니다.'}
 const cards=document.getElementById('cards');if(cards)new MutationObserver(updateRecent).observe(cards,{childList:true});
 updateRecent();
})();
